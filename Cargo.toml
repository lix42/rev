[package]
name = "rev"
version = "0.1.0"
edition = "2024"
description = "TUI-native code review tool for AI agent workflows"
license = "MIT"
rust-version = "1.94"

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Diff engine
similar = { version = "2", features = ["unicode"] }

# Syntax highlighting
syntect = "5"

# File watching
notify = "7"
notify-debouncer-mini = "0.5"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"
dirs = "6"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Git
git2 = "0.19"

[dev-dependencies]
tempfile = "3"
